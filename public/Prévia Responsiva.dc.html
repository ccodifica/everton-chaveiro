<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prévia responsiva · Everton Chaveiro</title>
<link rel="icon" type="image/png" href="./assets/logo.png">
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1220;color:#fff;font-family:Nunito,system-ui,sans-serif}
a{color:#8BB8F0}a:hover{color:#fff}
</style>
</helmet>
<div style="padding:clamp(16px,3vw,32px); display:flex; flex-direction:column; gap:22px">
  <div style="display:flex; align-items:baseline; gap:8px 18px; flex-wrap:wrap">
    <h1 style="margin:0; font:800 20px/1.2 Nunito,sans-serif">Prévia responsiva · Everton Chaveiro</h1>
    <span style="font:600 14px Nunito,sans-serif; color:rgba(255,255,255,.55)">Celular, tablet e desktop lado a lado. Cada tela é a página real em escala.</span>
    <a href="index.html" style="font:800 14px Nunito,sans-serif; text-decoration:none; margin-left:auto">Abrir página completa ›</a>
  </div>
  <div style="display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start">
    <figure style="margin:0; display:flex; flex-direction:column; gap:10px">
      <figcaption style="font:600 13px Nunito,sans-serif; color:rgba(255,255,255,.6)">Celular · 390 × 844</figcaption>
      <div style="width:312px; height:675px; overflow:hidden; border-radius:28px; border:1px solid rgba(255,255,255,.16); background:#071B3A; box-shadow:0 30px 60px rgba(0,0,0,.45)">
        <iframe src="index.html" title="Celular" style="width:390px; height:844px; border:0; display:block; transform:scale(.8); transform-origin:0 0"></iframe>
      </div>
    </figure>
    <figure style="margin:0; display:flex; flex-direction:column; gap:10px">
      <figcaption style="font:600 13px Nunito,sans-serif; color:rgba(255,255,255,.6)">Tablet · 820 × 1180</figcaption>
      <div style="width:451px; height:649px; overflow:hidden; border-radius:22px; border:1px solid rgba(255,255,255,.16); background:#071B3A; box-shadow:0 30px 60px rgba(0,0,0,.45)">
        <iframe src="index.html" title="Tablet" style="width:820px; height:1180px; border:0; display:block; transform:scale(.55); transform-origin:0 0"></iframe>
      </div>
    </figure>
    <figure style="margin:0; display:flex; flex-direction:column; gap:10px">
      <figcaption style="font:600 13px Nunito,sans-serif; color:rgba(255,255,255,.6)">Desktop · 1440 × 900</figcaption>
      <div style="width:720px; max-width:100%; aspect-ratio:1440/900; overflow:hidden; border-radius:14px; border:1px solid rgba(255,255,255,.16); background:#071B3A; box-shadow:0 30px 60px rgba(0,0,0,.45)">
        <iframe src="index.html" title="Desktop" style="width:1440px; height:900px; border:0; display:block; transform:scale(.5); transform-origin:0 0"></iframe>
      </div>
    </figure>
  </div>
</div>
</x-dc>
</body>
</html>
